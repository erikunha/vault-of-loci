name: Question
description: Ask how to use or adapt the vault, after checking FAQ.md.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What you are trying to do, and where you got stuck.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      placeholder: Obsidian 1.15, Claude Code, macOS
  - type: checkboxes
    id: read
    attributes:
      label: Before asking
      options:
        - label: I searched FAQ.md and the open issues.
          required: true
        - label: The question has no personal notes, keys or secrets.
          required: true
