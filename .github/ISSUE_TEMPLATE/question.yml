name: ❓ Question
description: Ask how to use or adapt the vault, after checking the FAQ.
labels: [question]
body:
  - type: markdown
    attributes:
      value: Check `90_System/Specs/FAQ.md` first. You can write in Portuguese or English.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and what did you try?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Obsidian version and the agent you use, if any.
