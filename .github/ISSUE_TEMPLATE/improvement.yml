name: Improvement
description: Propose a change that helps people study better with the vault.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change? Which files?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: For a study method, a verifiable source (DOI or arXiv ID).
