name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -I 90_System/Scripts/format_notes.py --check
      - run: python3 -I 90_System/Scripts/validation/check_links.py
      - run: python3 -I 90_System/Scripts/validation/check_study_layer.py
      - run: python3 -I 90_System/Scripts/validation/check_names.py
      - run: python3 -I 90_System/Scripts/validation/check_cards.py
      - run: python3 -I 90_System/Scripts/validation/check_skills.py
      - run: python3 -I 90_System/Scripts/validation/check_index.py
      - run: python3 -I 90_System/Scripts/validation/test_format_notes.py
      - run: python3 -I 90_System/Scripts/validation/test_normalize_names.py
      - run: python3 -I 90_System/Scripts/validation/test_check_links.py
      - run: python3 -I 90_System/Scripts/validation/test_check_study_layer.py
      - run: python3 -I 90_System/Scripts/validation/test_check_cards.py
      - run: python3 -I 90_System/Scripts/validation/test_check_skills.py
      - run: python3 -I 90_System/Scripts/validation/test_check_index.py
