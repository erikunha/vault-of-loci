name: contributors
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: contributors
  cancel-in-progress: true
jobs:
  table:
    # Copies made with "Use this template" keep this file; the table belongs to this repository only.
    if: github.repository == 'erikunha/vault-of-loci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python3 -I 90_System/Scripts/update_contributors.py --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -I 90_System/Scripts/build_index.py
      - name: Open a pull request when the table changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: bot/contributors
        run: |
          if git diff --quiet; then echo "table unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "docs: update contributors table"
          git push --force-with-lease origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --title "docs: update contributors table" \
              --body "Opened by .github/workflows/contributors.yml. Review the new names and kinds of contribution, then merge."
          fi
          # A pull request opened with GITHUB_TOKEN starts no workflow, so run the required check by hand.
          gh workflow run checks.yml --ref "$BRANCH"
